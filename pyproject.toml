[project]
name = "assemble-api"
version = "0.1.2"
description = "API do Assemble (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "litellm>=1.103.2",
    "tzdata>=2026.4",
    "laya>=0.3.28",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# O HTML do e-mail tem linhas longas por natureza (estilos em linha).
[tool.ruff.lint.per-file-ignores]
"app/mailer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

# torch só para CPU (o Space não tem GPU; evita baixar as bibliotecas CUDA)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
