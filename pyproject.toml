[project]
name = "assemble-backend"
version = "0.1.0"
description = "Backend do Assemble (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "litellm>=1.103.2",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
