# Testa a cada push/PR. A publicação no Google Cloud Run é opcional e só roda por
# execução manual (Actions → Test and deploy → Run workflow). Hoje o backend roda no PC:
# docs/local-run.md. Preparação do GCP e das variáveis do GitHub: docs/cloud-run.md
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: [test, firestore-rules]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cloud-run-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: assemble-backend
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/assemble/assemble-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Build e push da imagem
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          echo "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "$REGION-docker.pkg.dev"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Um único processo mantém o limite de mensagens e o bloqueio dos jobs coerentes;
      # sem limitar a CPU, as tarefas em segundo plano dos /jobs/* e o carregamento do Laya
      # continuam depois da resposta.
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --no-cpu-throttling
            --cpu-boost
            --cpu=1
            --memory=3Gi
            --min-instances=0
            --max-instances=1
            --concurrency=20
            --timeout=900
          env_vars: |
            COMMANDCODE_BASE_URL=${{ vars.COMMANDCODE_BASE_URL }}
            CHAT_MODEL=${{ vars.CHAT_MODEL }}
            CHAT_FALLBACK_MODEL=${{ vars.CHAT_FALLBACK_MODEL }}
            PERSONA_MODEL=${{ vars.PERSONA_MODEL }}
            DEFAULT_TIMEZONE=America/Sao_Paulo
          secrets: |
            FIREBASE_SERVICE_ACCOUNT_JSON=assemble-firebase-service-account:latest
            COMICVINE_API_KEY=assemble-comicvine-api-key:latest
            COMMANDCODE_API_KEY=assemble-commandcode-api-key:latest
            JOBS_KEY=assemble-jobs-key:latest
