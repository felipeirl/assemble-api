# Executa um job do backend por demanda (Actions → Jobs → Run workflow).
# Sem agenda: o backend roda no PC, que não fica ligado o tempo todo (docs/local-run.md).
# Segredos em Settings → Secrets and variables → Actions:
#   ASSEMBLE_API_URL  URL pública do backend (o domínio do ngrok)
#   JOBS_KEY          mesmo valor da JOBS_KEY do .env
# Para agendar de novo (backend sempre no ar), acrescente em `on:`:
#   schedule: [{ cron: "0 6 * * *" }]
name: Jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job a executar"
        required: true
        type: choice
        options: [ingest, personas, purge]

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Chamar /jobs/${{ inputs.job }}
        env:
          API_URL: ${{ secrets.ASSEMBLE_API_URL }}
          JOBS_KEY: ${{ secrets.JOBS_KEY }}
          JOB: ${{ inputs.job }}
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 15 --retry-all-errors --max-time 120 \
            -X POST -H "X-Jobs-Key: $JOBS_KEY" \
            "$API_URL/jobs/$JOB"
