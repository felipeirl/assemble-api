# CI a cada push e pull request na main; CD na Discloud só após um push na main com a CI verde.
# Segredo necessário (Settings → Secrets and variables → Actions): DISCLOUD_API_TOKEN.
# Variável opcional: DISCLOUD_APP_URL (padrão: https://assemble.discloud.dev).
# O deploy automático nativo da Discloud (integração com o GitHub) precisa estar desligado,
# senão ele publica sem esperar esta CI: docs/discloud.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: [test, firestore-rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: discloud-deploy
      cancel-in-progress: false
    env:
      DISCLOUD_APP_ID: assemble
      DISCLOUD_API_URL: https://api.discloud.app/v2
      APP_URL: ${{ vars.DISCLOUD_APP_URL || 'https://assemble.discloud.dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0

      # Só arquivos versionados do commit, sem o que o .discloudignore tira do envio.
      - name: Montar o zip do deploy
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/app.zip" HEAD -- . \
            ':(exclude).git*' ':(exclude).github' ':(exclude)docs' ':(exclude)tests' \
            ':(exclude)firestore-tests' ':(exclude)scripts' ':(exclude)backup-pre-reescrita' \
            ':(exclude)Dockerfile' ':(exclude).dockerignore' ':(exclude)_archive'
          # O builder da Discloud exige um requirements.txt na raiz e roda `uvicorn main:app`
          # direto (ignora o START), então o uvicorn precisa estar instalado pelo pip. O export
          # sai do uv.lock; o torch do lock é a build CPU (2.x+cpu), que só existe no índice
          # do PyTorch, e o uv export não escreve esse índice.
          {
            echo '--extra-index-url https://download.pytorch.org/whl/cpu'
            uv export --frozen --no-dev --no-hashes --no-annotate --no-header --no-emit-project
          } > requirements.txt
          zip -q "$RUNNER_TEMP/app.zip" requirements.txt
          for required in discloud.config main.py pyproject.toml uv.lock requirements.txt; do
            unzip -l "$RUNNER_TEMP/app.zip" | grep -q " $required\$" \
              || { echo "::error::$required ausente do zip"; exit 1; }
          done
          for dependency in uvicorn fastapi torch; do
            grep -q "^$dependency==" requirements.txt \
              || { echo "::error::$dependency ausente do requirements.txt"; exit 1; }
          done
          unzip -l "$RUNNER_TEMP/app.zip" | tail -1

      - name: Enviar o commit à Discloud
        env:
          DISCLOUD_API_TOKEN: ${{ secrets.DISCLOUD_API_TOKEN }}
        run: bash .github/scripts/discloud-deploy.sh commit "$RUNNER_TEMP/app.zip"

      # O build com torch passa de 2 minutos e o proxy da Discloud corta a resposta antes; por
      # isso o resultado vem daqui: o app precisa ter reiniciado depois do envio e responder
      # em /health (até 12 minutos, o Laya demora a aquecer).
      - name: Esperar o app reiniciar e responder
        env:
          DISCLOUD_API_TOKEN: ${{ secrets.DISCLOUD_API_TOKEN }}
        run: bash .github/scripts/discloud-deploy.sh wait-ready
